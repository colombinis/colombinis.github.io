# SYSTEM_MAP.yaml — Ontología de superficies del sistema SACsi
# Editado por: LLM (propuestas) + Humano (revisión en PR)
# Validado por: scripts/verify-system-map.sh
#
# MODELO (4 niveles de relación):
#   page ─contiene─▶ component ─exhibe─▶ behavior ─depende de─▶ resource
#   (composición)      (composición)       (composición)        (dependencia hoja)
#
# ANATOMÍA (estable) vive aquí. El ESTADO de las tareas (DONE/TODO)
# NO vive aquí: se deriva escaneando docs/tareas/**/TODO.md (incl. archived)
# y se vuelca a docs/tareas/generated/system-map-coverage.json (generado).
version: 1
project: sacsi-com-ar

# ── Nivel 1: PÁGINAS (rutas Astro SSG, desde src/pages) ───────────
pages:
  - id: home
    path: /
    components: [header, footer, soluciones-section, social-proof-section, casos-carousel]
    behaviors: [estilo-alineado, pageview-tracking]
  - id: contacto
    path: /contacto
    components: [header, footer]
    behaviors: [estilo-alineado, form-submit-tracking, pageview-tracking]
  - id: catalogo
    path: /catalogo
    components: [header, footer]
    behaviors: [estilo-alineado, filtros-jerarquicos, pageview-tracking]
  - id: servicios
    path: /servicios
    components: [header, footer, service-card]
    behaviors: [estilo-alineado, pageview-tracking]
  - id: sobre-nosotros
    path: /sobre-nosotros
    components: [header, footer]
    behaviors: [estilo-alineado, pageview-tracking]
  - id: casos-exito
    path: /casos-exito/*
    components: [header, footer, todos-casos-section]
    behaviors: [estilo-alineado, pageview-tracking]
  - id: trabajos
    path: /trabajos/[id]
    components: [header, footer]
    behaviors: [estilo-alineado, pageview-tracking]

# ── Nivel 2: COMPONENTES (src/components reales) ─────────────────
components:
  - id: header
    type: layout
    behaviors: [estilo-alineado]
  - id: footer
    type: layout
    behaviors: [estilo-alineado, cta-whatsapp]
  - id: service-card
    type: card
    behaviors: [estilo-alineado]
  - id: soluciones-section
    type: section
    behaviors: [estilo-alineado]
  - id: social-proof-section
    type: section
    behaviors: [estilo-alineado]
  - id: casos-carousel
    type: widget
    behaviors: [estilo-alineado]
  - id: todos-casos-section
    type: section
    behaviors: [estilo-alineado]

# ── Nivel 3: COMPORTAMIENTOS (lo observable en el sistema) ───────
# source_specs vacío = UNCOVERED (🔴): ninguna spec lo define hoy.
behaviors:
  - id: estilo-alineado
    desc: "Todos los bloques respetan tokens DESIGN.md (color/tipografía/espaciado)"
    source_specs: [MAR-01]    # 🟢 definido en spec FEATURE-marca
    depends_on: [design-tokens]
  - id: cta-whatsapp
    desc: "Links a WhatsApp con mensaje pre-cargado desde config.site.json (override opcional explícito)"
    source_specs: [MAR-02]    # 🟢 definido en spec FEATURE-marca
    depends_on: [site-config]
  - id: pageview-tracking
    desc: "dataLayer.push pageview vía GTM en cada página (Layout.astro global)"
    source_specs: [CON-01]    # 🟢 definido en spec archived (CON-01)
    depends_on: [gtm-t7pwj99]
  - id: form-submit-tracking
    desc: "dataLayer.push form_submit en submit de contacto (Layout.astro global)"
    source_specs: [CON-04]    # 🟢 definido en spec FASE-4
    depends_on: [gtm-t7pwj99]
  - id: filtros-jerarquicos
    desc: "Filtros servicio→categoría + búsqueda textual (inline en catalogo.astro, vanilla JS)"
    source_specs: [CAT-02]    # 🟢 definido en spec FEATURE-2
    depends_on: [data-utils]
    code_artifact: "catalogo.astro"   # filtros inline en src/pages/catalogo.astro (vanilla JS)

# ── RECURSOS (dependencias HOJA, NO superficies) ─────────────────
resources:
  - id: design-tokens
    kind: design-system
    desc: "DESIGN.md — primary/secondary/tertiary, tipografía, espaciado"
  - id: site-config
    kind: config
    desc: "src/config/site.json — whatsapp, email, social, form_endpoint"
  - id: gtm-t7pwj99
    kind: analytics
    desc: "Contenedor GTM que recibe whatsapp_click, form_submit, pageview"
  - id: data-utils
    kind: code-module
    desc: "src/lib/data-utils.ts — getServicios/getCategorias/getTrabajos"
