version: '3.8'

services:
  n8n:
    # Imagen: latest (n8n no publica tags semver estables, :latest es el canal de actualizaciones)
    # Si preferís estabilidad sobre nuevas features: fijá una versión específica
    # Ej: image: n8nio/n8n:1.100.0
    # Luego: docker compose pull n8n && docker compose up -d --force-recreate
    image: n8nio/n8n
    container_name: sacsi-n8n
    restart: unless-stopped
    # Corremos como root para evitar EACCES en /home/node/.n8n/config
    # En producción, cambiar a user: "1000:1000" y asegurar permisos del volume
    user: "0:0"
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - N8N_LISTEN_ADDRESS=0.0.0.0
      # Desactiva el chequeo estricto de permisos del config file
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      # Evita bug de Code nodes en task runner
      - N8N_RUNNERS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-S", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: sacsi-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DB separada para el estado de clientes (progreso de formularios)
  clientes_db:
    image: postgres:16-alpine
    container_name: sacsi-clientes-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=clientes
      - POSTGRES_USER=${POSTGRES_USER_CLIENTES}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_CLIENTES}
    volumes:
      - clientes_db_data:/var/lib/postgresql/data
      - ./init_clientes_db.sql:/docker-entrypoint-initdb.d/init_clientes_db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_CLIENTES}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servidor de emails para desarrollo
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sacsi-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

# Volumes nombrados (manejan permisos automáticamente)
volumes:
  n8n_data:
  postgres_data:
  clientes_db_data: