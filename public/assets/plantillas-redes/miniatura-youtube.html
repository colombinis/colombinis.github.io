<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Miniatura YouTube — Plantilla SACsi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #111; }
  .frame { width: 1280px; height: 720px; position: relative; overflow: hidden; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(26,26,46,0.25) 0%, rgba(0,0,0,0.85) 100%); }
  .brand { position: absolute; top: 32px; left: 40px; display: flex; align-items: center; gap: 12px; }
  .brand img { height: 44px; }
  .brand span { color: #fff; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .content { position: absolute; left: 40px; right: 40px; bottom: 48px; }
  h2 { font-size: 56px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: #fff; margin-bottom: 12px; max-width: 900px; }
  .meta { display: inline-flex; align-items: center; gap: 10px; }
  .meta span { background: #0A7CFF; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border-radius: 100px; }
</style>
</head>
<body>
  <div class="frame">
    <!-- CAMBIAR: imagen de fondo -->
    <div class="bg" style="background-image: url('../assets/sacsi-servicios-13-dashboards.webp');"></div>
    <div class="vignette"></div>
    <div class="brand">
      <img src="../logo.svg" alt="SACsi">
      <span>SACsi</span>
    </div>
    <div class="content">
      <h2>Dashboard que suma, no que complica</h2>
      <div class="meta"><span>Video</span></div>
    </div>
  </div>
</body>
</html>
