<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  SACsi Logo — Versión Rebranding 2026
  ======================================
  Paleta: Navy profundo (#1A1A2E) + Azul eléctrico (#0A7CFF)
  Estilo: minimalista, flat, tipografía del sistema
  Layout: "SAC" sobre navy, "si" sobre azul eléctrico — unificado en una sola base
-->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="100" viewBox="0 0 280 100">
  <desc>Logo SACsi: "SAC" texto sobre fondo navy (#1A1A2E), "si" sobre azul eléctrico (#0A7CFF). Diseño plano, tipografía bold sans-serif.</desc>

  <!-- Navy background (left half) -->
  <rect x="0" y="0" width="140" height="100" fill="#1A1A2E"/>

  <!-- Electricity blue background (right half) -->
  <rect x="140" y="0" width="140" height="100" fill="#0A7CFF"/>

  <!-- Texto "SAC" sobre navy -->
  <text x="70" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SAC</text>

  <!-- Texto "si" sobre azul eléctrico -->
  <text x="210" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">si</text>
</svg>
