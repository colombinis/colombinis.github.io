<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  SACsi Logo — Versión Rebranding 2026 (colores originales preservados)
  ======================================
  Paleta: Azul original #00A1F1 (izquierda) + Naranja original #F16529 (derecha)
  Estilo: minimalista, flat, tipografía del sistema
  Layout: "SAC" sobre azul (#00A1F1), "si" sobre naranja (#F16529)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="100" viewBox="0 0 280 100">
  <desc>Logo SACsi: "SAC" texto sobre fondo azul (#00A1F1), "si" sobre fondo naranja (#F16529). Diseño plano, tipografía bold sans-serif.</desc>

  <!-- Azul background (left half) -->
  <rect x="0" y="0" width="140" height="100" fill="#00A1F1"/>

  <!-- Naranja background (right half) -->
  <rect x="140" y="0" width="140" height="100" fill="#F16529"/>

  <!-- Texto "SAC" sobre azul -->
  <text x="70" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SAC</text>

  <!-- Texto "si" sobre naranja -->
  <text x="210" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">si</text>
</svg>
